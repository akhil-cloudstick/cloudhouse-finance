name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_FOLDER: ${{ secrets.S3_FOLDER }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: frontend/core/go.mod
          cache-dependency-path: frontend/core/go.sum
      - run: npm ci
      - run: npm run dist:win
      - if: ${{ github.event_name == 'push' && !endsWith(github.ref_name, '-test') }}
        run: npm run upload
      - if: ${{ github.event_name == 'push' && !endsWith(github.ref_name, '-test') }}
        run: npm run download
