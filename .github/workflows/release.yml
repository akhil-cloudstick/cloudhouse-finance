name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tenant:
        description: "Tenant code (B2 folder name), e.g. ctfi. Blank = default/common build."
        required: false
        default: ""
      version:
        description: "Version to build, e.g. 1.4.0. Blank = use frontend/package.json's version."
        required: false
        default: ""
      build_type:
        description: "content = web-app content package only; full = real installer."
        required: true
        default: "full"
        type: choice
        options: ["full", "content"]
      target:
        description: "OS(es) to build, comma-separated, e.g. \"win,linux\" (ignored for build_type=content, and for a tag push — which builds all three)."
        required: true
        default: "win"

jobs:
  win:
    # Content has no native build, so it always runs here regardless of target.
    if: ${{ github.event_name == 'push' || contains(github.event.inputs.target, 'win') || github.event.inputs.build_type == 'content' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
      DESKTOP_API_BASE: ${{ secrets.DESKTOP_API_BASE }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_FOLDER: ${{ secrets.S3_FOLDER }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      RELEASE_TENANT: ${{ github.event.inputs.tenant }}
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      RELEASE_BUILD_TYPE: ${{ github.event.inputs.build_type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        if: ${{ github.event.inputs.build_type != 'content' }}
        with:
          go-version-file: frontend/desktop/go.mod
          cache-dependency-path: frontend/desktop/go.sum
      - run: npm ci
      # "full" = the real per-tenant installer; "content" = the shared web-content package only.
      - if: ${{ github.event.inputs.build_type != 'content' }}
        run: npm run dist:win
      - if: ${{ github.event.inputs.build_type == 'content' }}
        run: npm run dist:content
      # Runs for a tag push AND an on-demand dispatch, unless the tag is a -test one.
      - if: ${{ !(github.event_name == 'push' && endsWith(github.ref_name, '-test')) }}
        run: npm run upload
      - if: ${{ !(github.event_name == 'push' && endsWith(github.ref_name, '-test')) }}
        run: npm run download
      # Keeps at most 5 versions per tenant per OS in B2 (FCFO); no-ops for a content release.
      - if: ${{ !(github.event_name == 'push' && endsWith(github.ref_name, '-test')) }}
        run: npm run prune

  mac:
    # Wails apps need their native GUI library, so this builds natively on macOS — never cross-compiled from Windows.
    if: ${{ (github.event_name == 'push' || contains(github.event.inputs.target, 'mac')) && github.event.inputs.build_type != 'content' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
      DESKTOP_API_BASE: ${{ secrets.DESKTOP_API_BASE }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_FOLDER: ${{ secrets.S3_FOLDER }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      RELEASE_TENANT: ${{ github.event.inputs.tenant }}
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      RELEASE_BUILD_TYPE: ${{ github.event.inputs.build_type }}
      # Signing/notarization — no-ops until these exist, so the build stays green either way.
      # MACOS_CERTIFICATE_P12_BASE64: `base64 -i DeveloperIDApplication.p12 | pbcopy` of your exported cert.
      # MACOS_CERTIFICATE_PASSWORD: the password you set exporting that .p12.
      # MACOS_SIGNING_IDENTITY: e.g. "Developer ID Application: Your Name (TEAMID)" — `security find-identity -v -p codesigning` shows it.
      # APPLE_APP_SPECIFIC_PASSWORD: appleid.apple.com → Sign-In and Security (not your real Apple ID password).
      # APPLE_TEAM_ID: developer.apple.com → Membership.
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: frontend/desktop/go.mod
          cache-dependency-path: frontend/desktop/go.sum
      - run: npm ci
      - run: npm run dist:mac
      # secrets can't be referenced directly in `if:` — that's why these read from env (set above) instead.
      - name: Import signing certificate
        if: ${{ env.MACOS_CERTIFICATE_P12_BASE64 != '' }}
        run: |
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12
      - name: Codesign .app
        if: ${{ env.MACOS_SIGNING_IDENTITY != '' }}
        run: codesign --deep --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" dist/*.app
      - name: Notarize .app
        if: ${{ env.APPLE_ID != '' }}
        run: |
          APP=$(ls dist/*.app)
          ditto -c -k --keepParent "$APP" dist/notarize-submission.zip
          xcrun notarytool submit dist/notarize-submission.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          rm dist/notarize-submission.zip
      - run: npm run finalize:mac
      - if: ${{ !(github.event_name == 'push' && endsWith(github.ref_name, '-test')) }}
        run: npm run upload
      - if: ${{ !(github.event_name == 'push' && endsWith(github.ref_name, '-test')) }}
        run: npm run download
      - if: ${{ !(github.event_name == 'push' && endsWith(github.ref_name, '-test')) }}
        run: npm run prune

  linux:
    if: ${{ (github.event_name == 'push' || contains(github.event.inputs.target, 'linux')) && github.event.inputs.build_type != 'content' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
      DESKTOP_API_BASE: ${{ secrets.DESKTOP_API_BASE }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_FOLDER: ${{ secrets.S3_FOLDER }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      RELEASE_TENANT: ${{ github.event.inputs.tenant }}
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      RELEASE_BUILD_TYPE: ${{ github.event.inputs.build_type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: frontend/desktop/go.mod
          cache-dependency-path: frontend/desktop/go.sum
      # Wails' Linux webview needs GTK/WebKitGTK headers to compile against.
      # Ubuntu 24.04 (ubuntu-latest) dropped the 4.0 package name — it's 4.1 now.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
      - run: npm run dist:linux
      - if: ${{ !(github.event_name == 'push' && endsWith(github.ref_name, '-test')) }}
        run: npm run upload
      - if: ${{ !(github.event_name == 'push' && endsWith(github.ref_name, '-test')) }}
        run: npm run download
      - if: ${{ !(github.event_name == 'push' && endsWith(github.ref_name, '-test')) }}
        run: npm run prune
