<!-- A deliberately EMPTY tab icon.

     It is the build-time default for every page, because a static export
     bakes one icon for all businesses and the platform mark used to be it —
     which meant every business saw the vendor's logo in the tab on each cold
     load until its own branding arrived. A blank square is the only value
     that is correct for every tenant.

     The real icon is installed before first paint by app/brand-preload.tsx
     from the per-slug cache, and again by applyFavicon once branding loads. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"></svg>
